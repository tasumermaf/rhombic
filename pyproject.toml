[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rhombic"
version = "0.3.1"
description = "Lattice topology benchmarks: what happens when you replace the cube"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.10"
authors = [{name = "TASUMER MAF", email = "timothy@promptcrafted.com"}]
keywords = [
    "lattice",
    "topology",
    "benchmark",
    "FCC",
    "rhombic-dodecahedron",
    "graph-theory",
    "signal-processing",
    "embedding",
    "spatial-computing",
    "weighted-graph",
    "spectral-graph-theory",
    "Fiedler-value",
    "algebraic-connectivity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]
nn = ["torch>=2.0"]
# Asset-1 / BM-battery analysis lanes (D1/D2/D3 classifiers, safetensors
# partial loads). CI installs [all]; without these the research tests
# failed at collection — the red badge of Jul 2026.
research = ["rhombic[nn]", "scikit-learn>=1.3", "safetensors>=0.4"]
all = ["rhombic[viz]", "rhombic[dev]", "rhombic[nn]", "rhombic[research]"]

[project.urls]
Homepage = "https://github.com/tasumermaf/rhombic"
Repository = "https://github.com/tasumermaf/rhombic"
Issues = "https://github.com/tasumermaf/rhombic/issues"
Changelog = "https://github.com/tasumermaf/rhombic/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]

# The sdist ships the library and its metadata only. Results, tests, papers,
# scripts and research notes stay in the repository. (0.2.0 and 0.3.0 shipped
# results/ and tests/ in the sdist; corrected 2026-09-05.)
# Pin the core metadata version: hatchling 1.32 emits 2.5, which twine 6.2 /
# packaging 25 reject at check time (2026-09-05). 2.4 is what 0.3.0 shipped.
[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
only-include = ["rhombic", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]
exclude = ["rhombic/data/*_private.json"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["rhombic"]
exclude = ["rhombic/data/*_private.json"]
